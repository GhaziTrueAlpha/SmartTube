name: Sync Upstream & Build Custom Release

on:
  schedule:
    # Checks yuliskov/SmartTube for new releases every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build and publish a release even if no new upstream release is found'
        required: false
        default: false
        type: boolean
      flavor:
        description: 'Build flavor (stbeta or ststable)'
        required: false
        default: 'stbeta'
        type: choice
        options:
          - stbeta
          - ststable

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-and-release
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: yuliskov/SmartTube
      UPSTREAM_BRANCH: master
      FORK_BRANCH: master
      FLAVOR: ${{ inputs.flavor || 'stbeta' }}
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check for New Upstream Release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=1" \
            | jq -r '.[0].tag_name // empty')

          if [ -z "$UPSTREAM_TAG" ]; then
            echo "Could not fetch latest release tag from ${UPSTREAM_REPO}."
            exit 1
          fi

          CUSTOM_TAG="${UPSTREAM_TAG}-custom"
          echo "upstream_tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"

          if gh release view "$CUSTOM_TAG" >/dev/null 2>&1; then
            echo "Release ${CUSTOM_TAG} already exists in this fork."
            if [ "${{ inputs.force_build }}" = "true" ]; then
              echo "Force build requested; using tag ${CUSTOM_TAG}-r${{ github.run_number }}."
              echo "release_tag=${CUSTOM_TAG}-r${{ github.run_number }}" >> "$GITHUB_OUTPUT"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "New upstream release detected: ${UPSTREAM_TAG}"
            echo "release_tag=${CUSTOM_TAG}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Upstream Changes (Preserve Fork Commits)
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ steps.check.outputs.upstream_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || \
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}" --tags

          if git merge "upstream/${UPSTREAM_BRANCH}" --no-edit; then
            echo "Merged upstream/${UPSTREAM_BRANCH} cleanly."
            git submodule update --init --recursive
            git push origin "${FORK_BRANCH}"
          else
            echo "Merge conflict detected while syncing ${UPSTREAM_TAG}."
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            git merge --abort

            gh issue create \
              --title "Merge conflict syncing upstream SmartTube ${UPSTREAM_TAG}" \
              --body "$(cat <<EOF
          Automatic merge from \`${UPSTREAM_REPO}\` (\`${UPSTREAM_TAG}\`) hit a conflict in:

          \`\`\`
          ${CONFLICTS}
          \`\`\`

          Resolve locally in Termux and push back to \`${FORK_BRANCH}\`:

          \`\`\`bash
          git fetch upstream
          git merge upstream/${UPSTREAM_BRANCH}
          # Resolve the conflicted files above, then:
          git add .
          git commit -m "Merge upstream ${UPSTREAM_TAG}"
          git push origin ${FORK_BRANCH}
          \`\`\`

          After pushing, trigger **Sync Upstream & Build Custom Release** manually in the Actions tab with \`force_build\` enabled.
          EOF
          )"
            exit 1
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure APK Signing
        if: steps.check.outputs.should_build == 'true' && env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/key.jks" >> keystore.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > "${{ github.workspace }}/key.jks"

      - name: Grant Gradle Permissions
        if: steps.check.outputs.should_build == 'true'
        run: chmod +x gradlew

      - name: Build Custom Release APKs
        if: steps.check.outputs.should_build == 'true'
        run: |
          if [ "${FLAVOR}" = "ststable" ]; then
            ./gradlew clean assembleStstableRelease
          else
            ./gradlew clean assembleStbetaRelease
          fi

      - name: Publish GitHub Release with APKs
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ steps.check.outputs.upstream_tag }}
          RELEASE_TAG: ${{ steps.check.outputs.release_tag }}
        run: |
          APK_DIR="./smarttubetv/build/outputs/apk/${FLAVOR}/release"
          ls -la "$APK_DIR"

          gh release create "$RELEASE_TAG" "$APK_DIR"/*.apk \
            --title "SmartTube ${UPSTREAM_TAG} (Custom Build - ${FLAVOR})" \
            --notes "Automated build merging upstream [${UPSTREAM_REPO} ${UPSTREAM_TAG}](https://github.com/${UPSTREAM_REPO}/releases/tag/${UPSTREAM_TAG}) with custom fork changes from \`${FORK_BRANCH}\`."
